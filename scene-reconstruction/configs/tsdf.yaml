# TSDF + Depth Anything V2 pipeline configuration.
# All null values are required on the CLI (--log_dir, --video).

# ── Dyn-HaMR output ───────────────────────────────────────────────────────────
dynhamr:
  log_dir: null          # required: path to run_opt hydra output dir
  phase: smooth_fit      # subdirectory containing *_world_results.npz
  video_path: null       # required: original video .mp4 for frame extraction
  frames_dir: null       # optional: pre-extracted frames dir (skips extraction)
  mano_dir: null         # optional: path to MANO model dir; falls back to
                         #   Dyn-HaMR/_DATA/data/mano relative to log_dir

# ── Frame selection ────────────────────────────────────────────────────────────
frames:
  stride: 1              # integrate every Nth frame (1 = all frames)
  start: 0               # first frame index (0-based into sorted frame list)
  end: -1                # last frame index (-1 = all)

# ── Depth Anything V2 ─────────────────────────────────────────────────────────
depth:
  model: vitl            # vitl | vitb | vits
  checkpoint: null       # path to .pth; null = auto-locate in third-party/
  dataset: hypersim      # hypersim (indoor, metric) | vkitti (outdoor, metric)
  max_depth: 20.0        # clip depth maps beyond this value (meters)
  input_size: 518        # model input resolution (DA2 internal; output = input res)
  device: cuda           # cuda | cpu

# ── Hand masking ──────────────────────────────────────────────────────────────
masking:
  dilation_px: 15        # elliptical dilation kernel radius (pixels)
  use_sam2: false        # enable SAM2 video predictor for mask refinement
  sam2_checkpoint: null  # path to SAM2 .pt checkpoint (required if use_sam2)
  sam2_model_cfg: null   # path to SAM2 config yaml (required if use_sam2)
  sam2_prompt_interval: 30  # re-prompt SAM2 every N frames with MANO bbox

# ── TSDF integration (Open3D VoxelBlockGrid) ──────────────────────────────────
tsdf:
  voxel_size: 0.006           # meters per voxel; ~6mm suits tabletop scenes
  block_resolution: 16        # voxels per block edge
  block_count: 50000          # initial hash map capacity (auto-expands)
  depth_scale: 1000.0         # depth_m * depth_scale → uint16 (mm units for Open3D)
  depth_max: 5.0              # max integration depth (meters); should match depth.max_depth
  trunc_voxel_multiplier: 8.0 # truncation distance = voxel_size * this
  weight_threshold: 3.0       # min cumulative weight for mesh extraction
  device: CUDA:0              # Open3D device string; auto-falls-back to CPU:0

# ── Output ────────────────────────────────────────────────────────────────────
output:
  dir: null                   # null → <log_dir>/scene_reconstruction/
  mesh_filename: scene_mesh.glb
  save_intermediate: false    # save per-frame depth .npy and mask .png
