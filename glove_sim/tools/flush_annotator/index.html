<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flush Annotator</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="sidebar">
    <h1>Flush Annotator</h1>
    <p>Select corresponding points on hand and glove in 3D.</p>
    <label>Hand GLB <input id="handFile" type="file" accept=".glb,.gltf" /></label>
    <label>Glove GLB <input id="gloveFile" type="file" accept=".glb,.gltf" /></label>
    <label>Reference frame idx <input id="frameIdx" type="number" value="119" /></label>
    <div class="row">
      <button id="targetHand">Target: Hand</button>
      <button id="targetGlove">Target: Glove</button>
    </div>
    <div class="row">
      <button id="undoBtn">Undo last point</button>
      <button id="clearBtn">Clear all</button>
    </div>
    <div class="row">
      <button id="saveBtn">Download annotations.json</button>
      <input id="loadAnn" type="file" accept=".json" />
    </div>
    <p id="status">Load both GLBs, then click on meshes to annotate.</p>
    <pre id="counts"></pre>
  </div>
  <canvas id="view"></canvas>
  <script type="module" src="./app.js"></script>
</body>
</html>
