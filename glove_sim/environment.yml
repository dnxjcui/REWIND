name: glove_sim
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # urdfpy uses np.float / np.int removed in NumPy 1.24+
  - numpy>=1.21,<1.24
  - scipy
  - six
  - pip
  - pip:
    - mujoco>=3.0
    - smplx>=0.1.28
    - torch
    - trimesh
    - pygltflib
    - dtaidistance
    - tqdm
